format = """
[](fg:crimson)\
[  ](fg:color100 bg:crimson)\
[$username](fg:color100 bg:crimson)\
[](fg:crimson)\
[](fg:rust)\
[  ](fg:color100 bg:rust)\
[$directory](fg:color100 bg:rust)\
[ ](fg:rust)\
$fill\
$battery\
$docker_context\
${custom.python_venv}\
$git_branch\
$git_state\
$git_status\
${custom.tmux}\
$line_break$character"""

palette = 'yugen-ash'

[palettes.yugen-ash]
color10 = "#ffffff"
color100 = "#fafafa"
color200 = "#d4d4d4"
color300 = "#a9a9a9"
color400 = "#696969"
color500 = "#505050"
color600 = "#303030"
color700 = "#151515"
color800 = "#000000"
crimson = "#bf616a"
rust = "#bc735c"
primary = "#ffbe89"
slate = "#5d6d7e"
ember = "#b35a3a"
mist = "#a8c4c4"
bloom = "#c38b9e"
tide = "#79a0aa"
sage = "#9db89c"
gold = "#d4a017"

