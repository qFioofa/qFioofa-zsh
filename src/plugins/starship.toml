[line_break]
disabled = false

# Active Python virtualenv name (only when $VIRTUAL_ENV is set — works in any dir,
# unlike the native [python] module which keys off project files).
[custom.python_venv]
disabled = false
symbol = ""
command = 'basename "$VIRTUAL_ENV"'
when = 'test -n "$VIRTUAL_ENV"'
format = '[](fg:slate)[[ $symbol $output ](fg:color10 bg:slate)]($style)[](fg:slate) '
style = "bg:slate"

[custom.tmux]
disabled = false
command = "echo  "
when = "env | grep -q '^TMUX='"
format = '[](fg:sage)[[ $output ](fg:color100 bg:sage)]($style)[](fg:sage)'
style = "bg:sage"

[character]
disabled = false
success_symbol = '[  ](fg:crimson)'
error_symbol = '[  ](fg:gold)'
vimcmd_symbol = '[  ](bold fg:sage)'
vimcmd_replace_one_symbol = '[  ](bold fg:bloom)'
vimcmd_replace_symbol = '[  ](bold fg:bloom)'
vimcmd_visual_symbol = '[  ](bold fg:gold)'
