[battery]
disabled = false
full_symbol = '󰁹'
charging_symbol = '󰂄'
discharging_symbol = '󰂌'
unknown_symbol = '󰁽'
empty_symbol = '󰂃'
format = '[ ](fg:gold)[ $symbol $percentage ]($style)[   ](fg:gold)'

[[battery.display]]
threshold = 20
style = 'fg:crimson'

[fill]
symbol = ' '

[username]
show_always = true
style_user = "bg:crimson fg:color10"
style_root = "bg:crimson fg:color10"
format = '[ $user ]($style)'

[directory]
style = "fg:color10 bg:rust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "~/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:sage"
format = '[[](fg:sage)[ $symbol $branch ](fg:color700 bg:sage)]($style)'

[git_state]
style = "bg:sage"
format = '[ \($state $progress_current/$progress_total\) ](fg:crimson bg:sage)'
rebase = "rebase"
merge = "merge"
revert = "revert"
cherry_pick = "cherry"
bisect = "bisect"
am = "am"
am_or_rebase = "am/rebase"

[git_status]
style = "bg:sage"
conflicted = '=${count} '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '
up_to_date = ''
untracked = '?${count} '
stashed = '*${count} '
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '✘${count} '
format = '[[ $all_status$ahead_behind](fg:color700 bg:sage)]($style)[](fg:sage)'

